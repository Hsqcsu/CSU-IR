name: Automated Unit Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.9'
        cache: 'pip'

    - name: Install dependencies (CPU PyTorch)
      run: |
        python -m pip install --upgrade pip
        
        # 1. Install lightweight CPU-only PyTorch first
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        
        # 2. Read from requirements/requirements_local.txt and strip out GPU torch packages
        REQ_FILE="requirements/requirements_local.txt"
        if [ -f "$REQ_FILE" ]; then
          grep -ivE '^(torch|torchvision|torchaudio)' "$REQ_FILE" > requirements_ci.txt || true
          pip install -r requirements_ci.txt
        else
          echo "Warning: $REQ_FILE not found!"
        fi
        
        # 3. Ensure pytest is installed and ready
        pip install pytest

    - name: Run Pytest
      run: |
        # Run tests
        pytest code_testing/test_basic.py -v
