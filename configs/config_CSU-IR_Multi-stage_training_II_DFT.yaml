# Configuration for CSU-IR Multi-stage Training - Stage II (DFT Simulation Data)

paths:
  # Base output directory (The script will automatically route to 'MD_DFT' or 'DFT_without_MD_pretraining')
  output_dir: check_points/Multi-stage_training_Stage_II_DFT
  tokenizer: model/tokenizer-smiles-roberta-1e_new

  # Data paths
  train_smiles: data/Multi-staged_training_data/Density functional simulation data/train_smiles.txt
  train_ir: data/Multi-staged_training_data/Density functional simulation data/train_ir.pt
  val_smiles: data/Multi-staged_training_data/Density functional simulation data/al_smiles.txt
  val_ir: data/Multi-staged_training_data/Density functional simulation data/val_ir.pt
  test_smiles: data/Multi-staged_training_data/Density functional simulation data/test_smiles.txt
  test_ir: data/Multi-staged_training_data/Density functional simulation data/Qtest_ir.pt

model_params:
  smiles_model:
    smiles_maxlen: 300
    max_position_embeddings: 505
    vocab_size: 181
    feature_dim: 768
  ir_model:
    output_channels: 768
    channels: 32
    dim: 1024
    no_txtnorm: false

training_params:
  stage: DFT          # Automatically triggers MD weight detection & path routing
  num_epochs: 1000    # Governed by early stopping
  patience: 15        # Early stopping patience on Val Recall@1
  device: auto

dataloader_params:
  batch_size: 208
  num_workers: 0

optimizer_params:
  learning_rate: 5.0e-5  
  weight_decay: 1.0e-2

scheduler_params:
  warmup_epochs: 10
